name: Migrate Supabase Storage to Backblaze B2

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js @aws-sdk/client-s3

      - name: Run Migration Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lsdnqbfiytyonvmzurxj.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'senpaiden-mangas' }}
          R2_REGION: ${{ secrets.R2_REGION || 'us-east-005' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || 'https://s3.us-east-005.backblazeb2.com' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/migrate_supabase_to_b2.js
