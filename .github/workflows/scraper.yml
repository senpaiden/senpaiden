name: Hourly Manga Scraper
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: github-action/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: github-action
      - name: Run scraper
        working-directory: github-action
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREFLY_API_BASE_URL: ${{ secrets.FIREFLY_API_BASE_URL }}
          FIREFLY_API_KEY: ${{ secrets.FIREFLY_API_KEY }}
          MANGAHOOK_API_BASE_URL: ${{ secrets.MANGAHOOK_API_BASE_URL }}
          MANGAHOOK_API_KEY: ${{ secrets.MANGAHOOK_API_KEY }}
          MAX_REQUESTS_PER_RUN: '100'
          REQUEST_DELAY_MS: '500'
        run: npx tsx scripts/scraper.ts
