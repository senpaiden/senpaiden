version: "3.8"

services:
  minio:
    image: minio/minio
    container_name: senpaiden-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=local_access_key
      - MINIO_ROOT_PASSWORD=local_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  hf-worker:
    build:
      context: ./hf-worker
      dockerfile: Dockerfile
    container_name: senpaiden-hf-worker
    ports:
      - "7860:7860"
    env_file:
      - ./hf-worker/.env
    environment:
      - PORT=7860
      - R2_ENDPOINT=http://minio:9000
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  minio_data:
